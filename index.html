<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cofrinho Inteligente v1.6</title>
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cofrinho">
    <meta name="theme-color" content="#09090b">
    <meta name="description" content="Aplicativo inteligente de gestão de poupança e controle de contas">
    
    <!-- Manifest PWA externo -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Ícones para diferentes plataformas -->
    <link rel="icon" type="image/png" href="icon-192.png" sizes="192x192">
    <link rel="icon" type="image/png" href="icon-512.png" sizes="512x512">
    <link class="apple-touch-icon" href="icon-192.png">
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then((registration) => {
                        console.log('[PWA] Service Worker registrado com sucesso:', registration);
                    })
                    .catch((error) => {
                        console.error('[PWA] Erro ao registrar Service Worker:', error);
                    });
            });
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #fafafa; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(39, 39, 42, 1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .tab-active { border-bottom: 2px solid #10b981; color: #10b981; }
        .scroll-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <header class="sticky top-0 z-30 glass-card p-5 rounded-b-[2.5rem] shadow-2xl mb-6">
        <div class="flex flex-col items-center text-center">
            <span class="text-zinc-500 text-[10px] font-bold uppercase tracking-[0.2em] mb-1">Saldo Acumulado</span>
            <h1 id="main-balance" class="text-4xl font-black text-emerald-400 tracking-tighter">R$ 0,00</h1>
            
            <div class="grid grid-cols-2 gap-4 w-full mt-5 pt-4 border-t border-zinc-800">
                <div class="bg-zinc-900/50 p-3 rounded-2xl border border-zinc-800/50">
                    <span class="text-zinc-500 text-[9px] uppercase block mb-1">Em Aberto</span>
                    <span id="month-debt" class="text-sm font-bold text-zinc-200">R$ 0,00</span>
                </div>
                <div class="bg-zinc-900/50 p-3 rounded-2xl border border-zinc-800/50 flex flex-col justify-center items-center">
                    <span class="text-zinc-500 text-[9px] uppercase block mb-1">Cobertura</span>
                    <span id="coverage-status" class="text-sm font-bold block">R$ 0,00</span>
                    <span id="coverage-badge" class="text-[8px] font-bold uppercase tracking-wider block mt-0.5"></span>
                </div>
            </div>
        </div>
    </header>

    <main class="px-4 space-y-6">
        <!-- Depósito Diário e Pílulas de Auditoria -->
        <section class="glass-card p-4 rounded-3xl">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Depósito Diário</h3>
                <span id="today-date" class="text-[10px] text-zinc-500"></span>
            </div>
            <div class="flex gap-3 mb-3">
                <div class="relative flex-1">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 text-sm">R$</span>
                    <input type="number" id="daily-input" placeholder="0,00" step="0.50" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl py-3 pl-10 pr-4 text-lg font-bold focus:border-emerald-500 transition-all outline-none">
                </div>
                <button onclick="confirmDailyDeposit()" id="btn-daily" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition-all px-6 rounded-2xl font-bold flex items-center gap-2">
                    <i data-lucide="check-circle" class="w-5 h-5"></i>
                </button>
            </div>
            
            <!-- Pílulas de Conciliação -->
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="openDepositHistoryModal('current')" class="bg-zinc-900/80 border border-zinc-800 p-2 rounded-xl text-left hover:bg-zinc-800 transition-colors">
                    <span class="text-[8px] text-zinc-500 uppercase font-bold block">Entradas do Mês</span>
                    <span id="pill-current-month" class="text-xs font-bold text-emerald-400">R$ 0,00</span>
                </button>
                <button onclick="openDepositHistoryModal('previous')" class="bg-zinc-900/80 border border-zinc-800 p-2 rounded-xl text-left hover:bg-zinc-800 transition-colors">
                    <span class="text-[8px] text-zinc-500 uppercase font-bold block">Mês Anterior</span>
                    <span id="pill-prev-month" class="text-xs font-bold text-zinc-400">R$ 0,00</span>
                </button>
            </div>
        </section>

        <div class="grid grid-cols-2 gap-3">
            <button onclick="openAporteModal()" class="flex items-center justify-center gap-2 p-4 bg-zinc-800 hover:bg-zinc-700 rounded-2xl border border-zinc-700 transition-all active:scale-95">
                <i data-lucide="arrow-up-circle" class="text-blue-400 w-5 h-5"></i>
                <span class="font-bold text-sm">Aporte</span>
            </button>
            <button onclick="openBillModal()" class="flex items-center justify-center gap-2 p-4 bg-zinc-800 hover:bg-zinc-700 rounded-2xl border border-zinc-700 transition-all active:scale-95">
                <i data-lucide="plus-square" class="text-emerald-400 w-5 h-5"></i>
                <span class="font-bold text-sm">Nova Conta</span>
            </button>
        </div>

        <section class="hidden">
            <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-3 ml-1">Cronograma de Meses</h3>
            <div id="monthly-schedule" class="grid grid-cols-3 gap-2"></div>
        </section>

        <div class="flex border-b border-zinc-800">
            <button onclick="setFilter('pending')" id="tab-pending" class="flex-1 py-3 text-xs font-bold uppercase tracking-widest tab-active">Pendentes</button>
            <button onclick="setFilter('paid')" id="tab-paid" class="flex-1 py-3 text-xs font-bold uppercase tracking-widest text-zinc-500">Pagas</button>
            <button onclick="setFilter('all')" id="tab-all" class="flex-1 py-3 text-xs font-bold uppercase tracking-widest text-zinc-500">Tudo</button>
        </div>

        <!-- Container de Compromissos com Controle Anti-Pergaminho -->
        <div class="space-y-3">
            <div id="bills-container" class="space-y-3"></div>
            <div id="see-more-container" class="hidden text-center pt-1">
                <button onclick="toggleSeeAll()" id="btn-see-more" class="w-full py-3 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 rounded-xl text-xs font-bold text-zinc-400 flex items-center justify-center gap-2 transition-all">
                    <span>Ver Mais Compromissos</span>
                    <i data-lucide="chevron-down" id="icon-see-more" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <section class="glass-card p-4 rounded-3xl space-y-3">
            <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Segurança dos Dados</h3>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="exportData()" class="flex items-center justify-center gap-2 py-3 bg-zinc-900 border border-zinc-700 hover:bg-zinc-800 active:scale-95 transition-all text-xs font-bold text-zinc-200 rounded-xl">
                    <i data-lucide="download" class="w-4 h-4 text-emerald-400"></i>
                    Fazer Backup
                </button>
                <label class="flex items-center justify-center gap-2 py-3 bg-zinc-900 border border-zinc-700 rounded-xl hover:bg-zinc-800 active:scale-95 transition-all text-xs font-bold text-zinc-200 cursor-pointer">
                    <i data-lucide="upload" class="w-4 h-4 text-blue-400"></i>
                    Restaurar
                    <input type="file" id="import-file" accept=".txt" onchange="importData(event)" class="hidden">
                </label>
            </div>
        </section>

        <div class="pt-4 pb-4 flex justify-center">
            <button onclick="resetAllData()" class="text-rose-500/60 hover:text-rose-500 text-[10px] font-bold uppercase tracking-widest flex items-center gap-1 transition-colors">
                <i data-lucide="trash-2" class="w-3 h-3"></i>
                Limpar Todos os Dados
            </button>
        </div>
    </main>

    <!-- Modal: Extrato com botão de Excluir Depósitos (Estilo Foto 1780134836872.jpeg) -->
    <div id="deposits-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="bg-zinc-900 w-full max-w-xs rounded-[2rem] p-5 border border-zinc-800 shadow-2xl flex flex-col max-h-[75vh]">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-zinc-800">
                <h3 id="deposits-modal-title" class="text-sm font-bold text-emerald-400 uppercase tracking-wider">Extrato de Depósitos</h3>
                <button onclick="closeDepositHistoryModal()" class="p-1 text-zinc-500"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="deposits-modal-list" class="overflow-y-auto space-y-2 flex-1 pr-1 scroll-hide">
                <!-- Injetado dinamicamente -->
            </div>
            <div class="pt-3 border-t border-zinc-800 mt-2 text-center">
                <span class="text-[10px] text-zinc-500 uppercase block">Total do Período</span>
                <span id="deposits-modal-total" class="text-lg font-black text-emerald-400">R$ 0,00</span>
            </div>
        </div>
    </div>

    <!-- Modal: Nova Conta -->
    <div id="bill-modal" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="bg-zinc-900 w-full max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 border border-zinc-800 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 id="bill-modal-title" class="text-xl font-bold">Lançar Compromisso</h3>
                <button onclick="closeBillModal()" class="p-2 text-zinc-500"><i data-lucide="x"></i></button>
            </div>
            <form id="bill-form" class="space-y-4">
                <input type="text" id="bill-name" required placeholder="Nome (Ex: Mercado, Aluguel...)" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-4 text-white focus:border-emerald-500 outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 text-xs">R$</span>
                        <input type="number" id="bill-value" step="0.01" required placeholder="Valor Total" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-4 pl-8 text-white focus:border-emerald-500 outline-none">
                    </div>
                    <input type="date" id="bill-date" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-4 text-white focus:border-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-zinc-500 uppercase mb-1 ml-1">Data do Lançamento</label>
                    <input type="date" id="bill-launch-date" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-4 text-white focus:border-emerald-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] text-zinc-500 uppercase mb-1 ml-1">Parcelas</label>
                        <select id="bill-installments" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-4 text-white outline-none">
                            <option value="1">À vista</option>
                            <option value="2">2x</option>
                            <option value="3">3x</option>
                            <option value="4">4x</option>
                            <option value="5">5x</option>
                            <option value="6">6x</option>
                            <option value="7">7x</option>
                            <option value="8">8x</option>
                            <option value="9">9x</option>
                            <option value="10">10x</option>
                            <option value="11">11x</option>
                            <option value="12">12x</option>
                        </select>
                    </div>
                    <div class="flex items-end pb-1">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="bill-recurring" class="w-5 h-5 rounded border-zinc-700 bg-zinc-800 text-emerald-600 focus:ring-0">
                            <span class="text-xs text-zinc-400">Conta Fixa (Mensal)</span>
                        </label>
                    </div>
                </div>
                <button type="submit" id="bill-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-2xl mt-4 shadow-lg shadow-emerald-900/20 transition-all active:scale-95">
                    SALVAR LANÇAMENTO
                </button>
            </form>
        </div>
    </div>

    <!-- Modal: Aporte -->
    <div id="aporte-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="bg-zinc-900 w-full max-w-xs rounded-[2rem] p-6 border border-zinc-800 shadow-2xl">
            <h3 class="text-lg font-bold mb-4 text-center">Realizar Aporte</h3>
            <div class="relative mb-4">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500 font-bold">R$</span>
                <input type="number" id="aporte-value" step="0.01" placeholder="0,00" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl p-4 pl-10 text-2xl font-black text-emerald-400 text-center outline-none">
            </div>
            <div class="mb-4">
                <label class="block text-[10px] text-zinc-500 uppercase mb-2 ml-1">Data (opcional)</label>
                <input type="date" id="aporte-date" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-3 text-white focus:border-emerald-500 outline-none text-sm">
            </div>
            <div class="flex gap-2">
                <button onclick="closeAporteModal()" class="flex-1 bg-zinc-800 py-4 rounded-xl font-bold text-zinc-400">Sair</button>
                <button onclick="confirmAporte()" class="flex-1 bg-blue-600 py-4 rounded-xl font-bold text-white">Aportar</button>
            </div>
        </div>
    </div>

    <!-- Modal: Editar / Excluir Lançamento -->
    <div id="edit-bill-modal" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="bg-zinc-900 w-full max-w-md rounded-t-[2rem] sm:rounded-[2rem] p-6 border border-zinc-800 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-emerald-400">Editar Lançamento</h3>
                <button onclick="closeEditBillModal()" class="p-2 text-zinc-500"><i data-lucide="x"></i></button>
            </div>
            <form id="edit-bill-form" class="space-y-4">
                <input type="hidden" id="edit-bill-id">
                <input type="text" id="edit-bill-name" required placeholder="Nome" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-4 text-white focus:border-emerald-500 outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 text-xs">R$</span>
                        <input type="number" id="edit-bill-value" step="0.01" required placeholder="Valor" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-4 pl-8 text-white focus:border-emerald-500 outline-none">
                    </div>
                    <input type="date" id="edit-bill-date" required class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-4 text-white focus:border-emerald-500 outline-none">
                </div>
                <div id="edit-bill-installments-info" class="text-[11px] text-zinc-400 bg-zinc-800/50 p-3 rounded-xl min-h-[20px]"></div>
                <div class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="edit-bill-recurring" class="w-5 h-5 rounded border-zinc-700 bg-zinc-800 text-emerald-600 focus:ring-0">
                    <label for="edit-bill-recurring" class="text-xs text-zinc-400">Conta Fixa (Mensal)</label>
                </div>
                
                <div class="flex flex-col gap-2 pt-2">
                    <div class="grid grid-cols-2 gap-3">
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-2xl shadow-lg shadow-emerald-900/20 transition-all active:scale-95 uppercase text-sm tracking-wider">
                            SALVAR
                        </button>
                        <button type="button" onclick="closeEditBillModal()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-black py-4 rounded-2xl transition-all active:scale-95 uppercase text-sm tracking-wider">
                            CANCELAR
                        </button>
                    </div>
                    <button type="button" onclick="deleteBillFromModal()" class="w-full bg-rose-600/20 hover:bg-rose-600 border border-rose-500/40 text-rose-200 hover:text-white font-bold py-3 rounded-xl transition-all uppercase text-xs tracking-wider mt-2">
                        🗑️ Excluir este Lançamento
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- State ---
        let state = {
            balance: 0,
            bills: [],
            history: [],
            filter: 'pending'
        };

        let editingBillId = null;
        let seeAllBills = false;
        let currentModalType = 'current';
        const STORAGE_KEY = 'provisoes_v3_3_data';

        // --- Função de Data Local Segura (Vacina de Fuso) ---
        function getLocalDateStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function init() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) state = JSON.parse(saved);
            
            // Correção retroativa automática de IDs antigos do histórico que não tinham ID único
            let internalCheck = false;
            if (state.history) {
                state.history = state.history.map(h => {
                    if (!h.id) {
                        h.id = 'dep_' + h.date + '_' + Math.random().toString(36).substr(2, 5);
                        internalCheck = true;
                    }
                    return h;
                });
            }
            if (internalCheck) localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

            const today = new Date();
            document.getElementById('today-date').innerText = today.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
            checkTodayDeposit();
            generateRecurringBills();
            render();
        }

        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            render();
        }

        // --- Depósito Diário ---
        function confirmDailyDeposit() {
            const todayStr = getLocalDateStr();
            const alreadyDone = state.history.some(h => h.date === todayStr);
            
            if (alreadyDone) return;

            const amount = parseFloat(document.getElementById('daily-input').value);
            if(isNaN(amount) || amount <= 0) return;
            
            state.balance += amount;
            state.history.push({ 
                id: 'dep_' + todayStr + '_' + Math.random().toString(36).substr(2, 5),
                date: todayStr, 
                amount: amount 
            });
            
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            
            document.getElementById('daily-input').value = '';
            checkTodayDeposit();
            render();
        }

        function checkTodayDeposit() {
            const todayStr = getLocalDateStr();
            const alreadyDone = state.history.some(h => h.date === todayStr);
            const btn = document.getElementById('btn-daily');
            const input = document.getElementById('daily-input');
            
            if (alreadyDone) {
                btn.disabled = true;
                btn.className = "bg-zinc-800 px-6 rounded-2xl font-bold flex items-center gap-2 border border-zinc-800 text-emerald-500/40 cursor-not-allowed";
                btn.innerHTML = '<i data-lucide="check" class="w-5 h-5"></i>';
                
                input.disabled = true;
                input.value = ''; 
                input.placeholder = "JÁ DEPOSITADO HOJE!"; 
                input.className = "w-full bg-zinc-950/80 border border-zinc-800 rounded-2xl py-3 pl-10 pr-4 text-sm font-bold text-emerald-500/50 transition-all outline-none text-center select-none";
            } else {
                btn.disabled = false;
                btn.className = "bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition-all px-6 rounded-2xl font-bold flex items-center gap-2";
                btn.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5"></i>';
                
                input.disabled = false;
                input.placeholder = "0,00";
                input.className = "w-full bg-zinc-900 border border-zinc-700 rounded-2xl py-3 pl-10 pr-4 text-lg font-bold focus:border-emerald-500 transition-all outline-none";
            }
            lucide.createIcons();
        }

        // --- Aporte ---
        function confirmAporte() {
            const val = parseFloat(document.getElementById('aporte-value').value);
            const date = document.getElementById('aporte-date').value;
            if (val > 0) {
                const historyDate = date || getLocalDateStr();
                state.balance += val;
                state.history.push({ 
                    id: 'ap_' + historyDate + '_' + Math.random().toString(36).substr(2, 5),
                    date: historyDate, 
                    amount: val 
                });
                save();
                closeAporteModal();
                document.getElementById('aporte-value').value = '';
                document.getElementById('aporte-date').value = '';
            }
        }

        // --- Função crucial: Excluir/Estornar Depósito do Extrato ---
        function deleteDeposit(id) {
            const entryIndex = state.history.findIndex(h => h.id === id);
            if (entryIndex === -1) return;
            
            const entry = state.history[entryIndex];
            const fmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(entry.amount);
            
            if (confirm(`Deseja estornar e excluir o depósito de ${fmt} realizado em ${formatDate(entry.date)}?\nO valor será subtraído do Saldo Acumulado.`)) {
                state.balance -= entry.amount; // Tira o valor do saldo geral
                state.history.splice(entryIndex, 1); // Remove do histórico
                
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                checkTodayDeposit();
                render();
                
                // Recarrega o modal de extrato aberto para atualizar a visualização imediatamente
                openDepositHistoryModal(currentModalType);
            }
        }

        // --- Lançamentos e Quitação ---
        function payBill(id) {
            const bill = state.bills.find(b => b.id === id);
            if (bill && !bill.paid) {
                if (state.balance >= bill.value) {
                    state.balance -= bill.value;
                    bill.paid = true;
                    if (bill.recurring) generateRecurringBills();
                    save();
                } else {
                    alert('Saldo insuficiente no cofrinho!');
                }
            }
        }

        function deleteBillFromModal() {
            if (!editingBillId) return;
            const bill = state.bills.find(b => b.id === editingBillId);
            if (!bill) return;

            if (!confirm('Excluir este lançamento?')) return;

            if (bill.installments > 1) {
                const relatedBills = state.bills.filter(b => 
                    b.name === bill.name && 
                    b.installments === bill.installments &&
                    b.date >= bill.date
                );

                if (relatedBills.length > 1) {
                    const deleteRelated = confirm('Este lançamento faz parte de um parcelamento. Deseja excluir todas as parcelas relacionadas?\n\n[OK] = Deletar Todas\n[Cancelar] = Deletar Apenas Esta');
                    if (deleteRelated) {
                        state.bills = state.bills.filter(b => !relatedBills.includes(b));
                    } else {
                        state.bills = state.bills.filter(b => b.id !== editingBillId);
                    }
                } else {
                    state.bills = state.bills.filter(b => b.id !== editingBillId);
                }
            } else {
                state.bills = state.bills.filter(b => b.id !== editingBillId);
            }

            save();
            closeEditBillModal();
        }

        function openEditBillModal(id) {
            editingBillId = id;
            const bill = state.bills.find(b => b.id === id);
            if (!bill) return;

            document.getElementById('edit-bill-id').value = id;
            document.getElementById('edit-bill-name').value = bill.name;
            document.getElementById('edit-bill-value').value = bill.value;
            document.getElementById('edit-bill-date').value = bill.date;
            document.getElementById('edit-bill-recurring').checked = bill.recurring || false;

            let infoText = '';
            if (bill.installments > 1) {
                infoText = `Parcela ${bill.installmentNum} de ${bill.installments}`;
            }
            document.getElementById('edit-bill-installments-info').innerText = infoText;

            document.getElementById('edit-bill-modal').classList.remove('hidden');
            document.getElementById('edit-bill-name').focus();
        }

        function closeEditBillModal() {
            document.getElementById('edit-bill-modal').classList.add('hidden');
            editingBillId = null;
        }

        document.getElementById('edit-bill-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-bill-id').value;
            const bill = state.bills.find(b => b.id === id);
            if (!bill) return;

            const oldName = bill.name;
            const oldValue = bill.value;
            const oldDate = bill.date;

            bill.name = document.getElementById('edit-bill-name').value;
            bill.value = parseFloat(document.getElementById('edit-bill-value').value);
            bill.date = document.getElementById('edit-bill-date').value;
            bill.recurring = document.getElementById('edit-bill-recurring').checked;

            if (bill.installments > 1) {
                const relatedBills = state.bills.filter(b => 
                    b.name === oldName && 
                    b.installments === bill.installments &&
                    b.date >= oldDate
                );
                
                relatedBills.forEach((relBill, index) => {
                    relBill.name = bill.name;
                    relBill.value = bill.value;
                    relBill.recurring = bill.recurring;
                    if (index === 0) {
                        relBill.date = bill.date;
                    } else {
                        const d = new Date(bill.date + 'T00:00:00');
                        d.setMonth(d.getMonth() + index);
                        relBill.date = d.toISOString().split('T')[0];
                    }
                });
            }

            save();
            closeEditBillModal();
        });

        // --- Modals de Extrato Turbinado com Botão de Excluir ---
        function openDepositHistoryModal(type) {
            currentModalType = type;
            const now = new Date();
            let targetMonth, targetYear, titleText;
            
            if (type === 'current') {
                targetMonth = now.getMonth();
                targetYear = now.getFullYear();
                titleText = "Entradas de " + now.toLocaleDateString('pt-BR', { month: 'long' });
            } else {
                const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                targetMonth = prev.getMonth();
                targetYear = prev.getFullYear();
                titleText = "Entradas de " + prev.toLocaleDateString('pt-BR', { month: 'long' });
            }
            
            document.getElementById('deposits-modal-title').innerText = titleText;
            
            const filtered = state.history.filter(h => {
                const d = new Date(h.date + 'T00:00:00');
                return d.getMonth() === targetMonth && d.getFullYear() === targetYear;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));
            
            const listContainer = document.getElementById('deposits-modal-list');
            const fmt = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
            
            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-6 text-zinc-600 text-xs">Nenhum depósito registrado.</div>`;
            } else {
                listContainer.innerHTML = filtered.map(h => `
                    <div class="flex justify-between items-center bg-zinc-950/40 p-2.5 border border-zinc-800 rounded-xl group">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-zinc-400">${new Date(h.date + 'T00:00:00').toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'})}</span>
                            <span class="text-xs font-bold text-emerald-400">+ ${fmt(h.amount)}</span>
                        </div>
                        <button onclick="deleteDeposit('${h.id}')" class="text-zinc-600 hover:text-rose-400 p-1 rounded transition-colors" title="Excluir entrada">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `).join('');
            }
            
            const totalSum = filtered.reduce((acc, h) => acc + h.amount, 0);
            document.getElementById('deposits-modal-total').innerText = fmt(totalSum);
            
            document.getElementById('deposits-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeDepositHistoryModal() {
            document.getElementById('deposits-modal').classList.add('hidden');
        }

        function toggleSeeAll() {
            seeAllBills = !seeAllBills;
            render();
        }

        function resetAllData() {
            if (confirm('ATENÇÃO: Isso apagará todos os seus dados permanentemente. Confirmar?')) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        function generateRecurringBills() {
            const now = new Date();
            const windowMonths = 3;
            let added = false;
            state.bills.filter(b => b.recurring).forEach(baseBill => {
                const instances = state.bills.filter(b => b.name === baseBill.name && b.recurring);
                instances.sort((a, b) => new Date(b.date) - new Date(a.date));
                const latest = instances[0];
                let currentRefDate = new Date(latest.date + 'T00:00:00');
                const originalDay = new Date(baseBill.originalDate || baseBill.date + 'T00:00:00').getDate();
                const limitDate = new Date(now.getFullYear(), now.getMonth() + windowMonths, 1);
                while (currentRefDate < limitDate) {
                    let nextDate = new Date(currentRefDate);
                    nextDate.setMonth(nextDate.getMonth() + 1);
                    nextDate.setDate(originalDay);
                    if (nextDate.getDate() !== originalDay) nextDate.setDate(0);
                    const dateStr = nextDate.toISOString().split('T')[0];
                    const exists = state.bills.some(b => b.name === baseBill.name && b.date === dateStr);
                    if (!exists && nextDate < limitDate) {
                        state.bills.push({
                            ...baseBill,
                            id: Date.now().toString() + Math.random(),
                            date: dateStr,
                            originalDate: baseBill.originalDate || baseBill.date,
                            paid: false
                        });
                        added = true;
                    }
                    currentRefDate = nextDate;
                }
            });
            if (added) localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        // --- Backup e Restore ---
        function exportData() {
            const dataStr = JSON.stringify(state, null, 2);
            const blob = new Blob([dataStr], { type: 'text/plain' });
            const now = new Date();
            const dateStr = getLocalDateStr();
            
            const link = document.createElement('a');
            link.download = `backup_cofrinho_${dateStr}.txt`;
            link.href = window.URL.createObjectURL(blob);
            link.click();
        }

        // --- Renderizador da Interface ---
        function render() {
            const fmt = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            document.getElementById('main-balance').innerText = fmt(state.balance);
            
            const pendingBills = state.bills.filter(b => !b.paid);
            const monthDebt = pendingBills.reduce((acc, b) => {
                const d = new Date(b.date + 'T00:00:00');
                return (d.getMonth() === currentMonth && d.getFullYear() === currentYear) ? acc + b.value : acc;
            }, 0);
            document.getElementById('month-debt').innerText = fmt(monthDebt);
            
            const coverage = state.balance - monthDebt;
            const coverageEl = document.getElementById('coverage-status');
            const coverageBadge = document.getElementById('coverage-badge');
            
            if (coverage >= 0) {
                coverageEl.innerText = fmt(coverage);
                coverageEl.className = "text-sm font-black text-emerald-400";
                coverageBadge.innerText = "Mês protegido";
                coverageBadge.className = "text-[8px] font-bold uppercase tracking-wider block mt-0.5 text-emerald-500/80";
            } else {
                coverageEl.innerText = fmt(Math.abs(coverage));
                coverageEl.className = "text-sm font-black text-amber-500";
                coverageBadge.innerText = "Falta para fechar";
                coverageBadge.className = "text-[8px] font-bold uppercase tracking-wider block mt-0.5 text-amber-500/80";
            }
            
            // Valores das Pílulas de Auditoria
            const curMonthEntries = state.history.filter(h => {
                const d = new Date(h.date + 'T00:00:00');
                return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
            }).reduce((acc, h) => acc + h.amount, 0);
            
            const prevMonthDate = new Date(currentYear, currentMonth - 1, 1);
            const prevMonthEntries = state.history.filter(h => {
                const d = new Date(h.date + 'T00:00:00');
                return d.getMonth() === prevMonthDate.getMonth() && d.getFullYear() === prevMonthDate.getFullYear();
            }).reduce((acc, h) => acc + h.amount, 0);
            
            document.getElementById('pill-current-month').innerText = fmt(curMonthEntries);
            document.getElementById('pill-prev-month').innerText = fmt(prevMonthEntries);
            
            // Organizar as Contas da Base de Dados
            let displayBills = [...state.bills];
            if (state.filter === 'pending') displayBills = displayBills.filter(b => !b.paid);
            if (state.filter === 'paid') displayBills = displayBills.filter(b => b.paid);
            displayBills.sort((a, b) => new Date(a.date) - new Date(b.date));
            
            // Controle Limitador "Anti-Pergaminho"
            const maxVisible = 6;
            const totalBillsCount = displayBills.length;
            const container = document.getElementById('bills-container');
            const seeMoreBox = document.getElementById('see-more-container');
            
            if (totalBillsCount > maxVisible && !seeAllBills) {
                displayBills = displayBills.slice(0, maxVisible);
                seeMoreBox.classList.remove('hidden');
                document.getElementById('btn-see-more').innerHTML = `<span>Ver Mais (${totalBillsCount - maxVisible} compromissos)</span> <i data-lucide="chevron-down" class="w-4 h-4"></i>`;
            } else if (seeAllBills) {
                seeMoreBox.classList.remove('hidden');
                document.getElementById('btn-see-more').innerHTML = `<span>Recolher Lista</span> <i data-lucide="chevron-up" class="w-4 h-4"></i>`;
            } else {
                seeMoreBox.classList.add('hidden');
            }
            
            if (totalBillsCount === 0) {
                container.innerHTML = `<div class="text-center py-10 text-zinc-600 text-sm">Nenhum compromisso cadastrado nesta aba.</div>`;
            } else {
                container.innerHTML = displayBills.map(bill => {
                    const billDate = new Date(bill.date + 'T00:00:00');
                    const isOverdue = !bill.paid && billDate < new Date().setHours(0,0,0,0);
                    return `
                        <div class="glass-card p-4 rounded-2xl flex items-center justify-between ${bill.paid ? 'opacity-40' : ''}">
                            <div class="flex flex-col gap-1">
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-sm ${bill.paid ? 'line-through' : ''}">${bill.name}</span>
                                    ${bill.recurring ? '<i data-lucide="refresh-cw" class="w-3 h-3 text-blue-400"></i>' : ''}
                                    ${bill.installments > 1 ? `<span class="text-[9px] bg-zinc-800 px-1.5 py-0.5 rounded text-zinc-400">${bill.installmentNum}/${bill.installments}</span>` : ''}
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="text-[11px] ${isOverdue ? 'text-rose-400 font-bold' : 'text-zinc-500'}">${formatDate(bill.date)}</span>
                                    <span class="text-sm font-black text-emerald-400">${fmt(bill.value)}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                ${!bill.paid ? `
                                    <button onclick="payBill('${bill.id}')" class="bg-emerald-600/10 text-emerald-400 border border-emerald-600/20 px-4 py-2 rounded-xl text-xs font-black active:bg-emerald-600 active:text-white transition-all">PAGAR</button>
                                ` : `
                                    <i data-lucide="check-circle-2" class="text-zinc-600 w-5 h-5"></i>
                                `}
                                <button onclick="openEditBillModal('${bill.id}')" class="p-2 text-zinc-500 hover:text-blue-400 transition-colors"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            lucide.createIcons();
        }

        function setFilter(f) {
            state.filter = f;
            ['pending', 'paid', 'all'].forEach(id => {
                const el = document.getElementById('tab-' + id);
                el.className = `flex-1 py-3 text-xs font-bold uppercase tracking-widest ${id === f ? 'tab-active' : 'text-zinc-500'}`;
            });
            render();
        }

        function openBillModal() { 
            editingBillId = null;
            document.getElementById('bill-modal-title').innerText = 'Lançar Compromisso';
            document.getElementById('bill-form').reset();
            const today = getLocalDateStr();
            document.getElementById('bill-launch-date').value = today;
            document.getElementById('bill-date').value = today;
            document.getElementById('bill-modal').classList.remove('hidden'); 
            document.getElementById('bill-name').focus(); 
        }
        function closeBillModal() { document.getElementById('bill-modal').classList.add('hidden'); }
        
        function openAporteModal() { 
            const today = getLocalDateStr();
            document.getElementById('aporte-date').value = today;
            document.getElementById('aporte-modal').classList.remove('hidden'); 
            document.getElementById('aporte-value').focus(); 
        }
        function closeAporteModal() { document.getElementById('aporte-modal').classList.add('hidden'); }

        document.getElementById('bill-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('bill-name').value;
            const totalValue = parseFloat(document.getElementById('bill-value').value);
            const firstDateStr = document.getElementById('bill-date').value;
            const launchDateStr = document.getElementById('bill-launch-date').value;
            const installments = parseInt(document.getElementById('bill-installments').value);
            const recurring = document.getElementById('bill-recurring').checked;
            
            if (installments > 1) {
                const partValue = totalValue / installments;
                for (let i = 0; i < installments; i++) {
                    const d = new Date(firstDateStr + 'T00:00:00');
                    d.setMonth(d.getMonth() + i);
                    state.bills.push({
                        id: Date.now().toString() + i + Math.random().toString(36).substr(2, 5),
                        name: name,
                        value: partValue,
                        date: d.toISOString().split('T')[0],
                        launchDate: launchDateStr,
                        installments: installments,
                        installmentNum: i + 1,
                        recurring: false,
                        paid: false
                    });
                }
            } else {
                state.bills.push({
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                    name: name,
                    value: totalValue,
                    date: firstDateStr,
                    launchDate: launchDateStr,
                    installments: 1,
                    installmentNum: 1,
                    recurring: recurring,
                    originalDate: firstDateStr,
                    paid: false
                });
            }
            save();
            generateRecurringBills();
            closeBillModal();
            e.target.reset();
        });

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (importedState && typeof importedState.balance === 'number' && Array.isArray(importedState.bills)) {
                        state = importedState;
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                        alert('Dados restaurados com absoluto sucesso!');
                        location.reload();
                    } else {
                        alert('Arquivo de backup inválido.');
                    }
                } catch (err) {
                    alert('Erro ao ler o arquivo.');
                }
            };
            reader.readAsText(file);
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
        }

        init();
    </script>
